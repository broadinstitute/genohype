# Cargo configuration shared by all contributors.
#
# To use sccache locally, set RUSTC_WRAPPER=sccache in your environment. Keeping
# it out of this file allows Cargo commands to work on machines without sccache.

[net]
git-fetch-with-cli = true

# Linux x86_64: mold linker settings (only used when building ON Linux)
# When cross-compiling from macOS, zigbuild handles linking automatically
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Linux ARM64: mold linker settings (only used when building ON Linux)
# [target.aarch64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Aliases for common operations
[alias]
# Cross-compile for Linux (for GCP VMs)
# Usage: cargo linux [--release]
linux = "zigbuild --target x86_64-unknown-linux-gnu"

# Build Linux worker binary and install to target/release for pool submit
# Usage: cargo worker (requires scripts/ in PATH)
# See: scripts/cargo-worker
