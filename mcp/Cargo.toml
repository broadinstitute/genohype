[package]
name = "genohype-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server primitives for genomic AI tools"
license = "MIT OR Apache-2.0"

[dependencies]
# MCP SDK (official modelcontextprotocol/rust-sdk)
rmcp = { version = "1.7", features = ["server", "transport-io"] }

# Async
async-trait = "0.1"
tokio = { version = "1.35", features = ["rt-multi-thread"] }

# Serialization + schema generation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
