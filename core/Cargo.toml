[package]
name = "genohype-core"
version = "0.1.0"
edition = "2021"
description = "Core data engine for Hail table format decoding and Parquet conversion"
license = "MIT"

[features]
default = ["gcp", "validation"]
gcp = ["object_store/gcp"]
aws = ["object_store/aws"]
http = ["object_store/http"]
validation = ["dep:jsonschema"]
export = []
genomic = ["dep:lru"]
vep = ["dep:fastvep-core", "dep:fastvep-io", "dep:fastvep-annotate", "dep:fastvep-loftee"]
clickhouse = ["export", "dep:reqwest"]
elasticsearch = ["export", "dep:reqwest"]
postgres = ["export", "dep:sqlx"]
bigquery = ["export", "dep:google-cloud-bigquery", "dep:google-cloud-storage"]

[dependencies]
# Compression
zstd = "0.13"
flate2 = "1.0"

# Arrow and Parquet
arrow = "53.3"
parquet = "53.3"

# Cloud storage (features enabled above)
object_store = { version = "0.11", default-features = false }
url = "2.5"
bytes = "1.9"
futures = "0.3"
once_cell = "1.19"

# Parsing
nom = "7.1"

# Async runtime (needed for object_store cloud backends)
tokio = { version = "1.35", features = ["rt-multi-thread", "sync"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Parallelism
rayon = "1.10"
crossbeam-channel = "0.5"

# Memory mapping for local file optimization
memmap2 = "0.9"

# Random sampling
rand = "0.8"

# VCF Support
noodles = { version = "0.91", features = ["vcf", "tabix", "bgzf", "core", "csi"] }

# Logging
tracing = "0.1"

# UUID generation (for temp files)
uuid = { version = "1.0", features = ["v4"] }

# Platform cache/config directory detection
dirs = "5"

# Progress bars (used by parquet converter, VCF reader, validation)
indicatif = "0.17"

# JSON Schema validation (validation feature)
jsonschema = { version = "0.27", default-features = false, optional = true }

# Async LRU cache for cloud IO chunk caching
moka = { version = "0.12", features = ["future"] }

# LRU Cache for the genomic client (genomic feature)
lru = { version = "0.12", optional = true }

# fastVEP types for VEP integration (vep feature)
fastvep-core = { workspace = true, optional = true }
fastvep-io = { workspace = true, optional = true }
fastvep-annotate = { workspace = true, optional = true }
fastvep-loftee = { workspace = true, optional = true }

# HTTP Client for ClickHouse export (clickhouse feature)
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

# Postgres client for the Postgres loader (postgres feature). No macros: the
# loader uses the runtime query/COPY API, not compile-time-checked queries, so no
# DATABASE_URL is needed at build time. TLS via rustls to match reqwest.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"], optional = true }

# Google Cloud for BigQuery export (bigquery feature). Use rustls so release
# binaries do not require a platform OpenSSL installation.
google-cloud-bigquery = { version = "0.13", default-features = false, features = ["auth", "rustls-tls"], optional = true }
google-cloud-storage = { version = "0.22", default-features = false, features = ["auth", "rustls-tls"], optional = true }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
