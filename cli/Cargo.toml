[package]
name = "genohype-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for Hail table format decoding and conversion"
license = "MIT"
build = "build.rs"

[features]
default = ["genohype-core/default", "gcp"]

# Cloud storage backends (forwarded to core and enabled locally)
gcp = ["genohype-core/gcp", "object_store/gcp"]
aws = ["genohype-core/aws", "object_store/aws"]
http = ["genohype-core/http", "object_store/http"]

# Optional features
validation = ["genohype-core/validation"]

# Genomic high-level API
genomic = ["genohype-core/genomic"]
vep = ["genohype-core/vep", "dep:fastvep-annotate", "dep:fastvep-core", "dep:fastvep-io"]
clickhouse = ["genohype-core/clickhouse", "reqwest/blocking"]
elasticsearch = ["genohype-core/elasticsearch", "reqwest/blocking"]
postgres = ["genohype-core/postgres"]
bigquery = ["gcp", "genohype-core/bigquery"]
benchmark = []  # sysinfo is now always included

# HTTP server binary (axum is always included for distributed coordinator)
server = ["dep:axum-extra", "dep:async-stream", "dep:tokio-stream"]

# All features
full = ["gcp", "aws", "http", "validation", "clickhouse", "elasticsearch", "postgres", "bigquery", "server", "benchmark", "vep"]

[dependencies]
# Core library
genohype-core = { path = "../core" }

# Pool library (distributed worker infrastructure)
genohype-pool = { path = "../pool" }

# Re-export/use core dependencies needed by CLI
tokio = { version = "1.35", features = ["rt-multi-thread", "sync", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-chrome = "0.7"
futures = "0.3"
bytes = "1.9"
rayon = "1.10"
uuid = { version = "1.0", features = ["v4"] }
crossbeam-channel = "0.5"

# Arrow and Parquet (needed directly by CLI for some operations)
arrow = "53.3"
parquet = "53.3"

# Cloud storage (needed directly by CLI modules)
object_store = { version = "0.11", default-features = false }
url = "2.5"

# Compression (needed by CLI modules)
flate2 = "1.0"
zstd = "0.13"

# Random (needed by CLI modules)
rand = "0.8"

# Memory mapping
memmap2 = "0.9"

# VCF Support (needed by CLI export modules)
noodles = { version = "0.91", features = ["vcf", "tabix", "bgzf", "core", "csi"] }

# Glob pattern matching for multi-file export
glob = "0.3"

# Misc
once_cell = "1.19"

# Progress bars
indicatif = "0.17"

# CLI
clap = { version = "4.4", features = ["derive"] }
owo-colors = "4"

# 2D rendering (Manhattan plots)
tiny-skia = "0.11"

# HTTP Client for distributed worker and ClickHouse export
# Use rustls for TLS to avoid OpenSSL cross-compilation issues
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# HTTP Server for distributed coordinator (and optional hail-server)
axum = "0.7"
tokio-util = { version = "0.7", features = ["io"] }

# CORS support for hail-server
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Embed static files for the dashboard SPA at compile time
rust-embed = "8"
mime_guess = "2"

# Additional HTTP server features (server feature)
axum-extra = { version = "0.9", features = ["query"], optional = true }
async-stream = { version = "0.3", optional = true }
tokio-stream = { version = "0.1", optional = true }

# System metrics (always included for worker telemetry)
sysinfo = "0.32"

# SQLite for metrics persistence (coordinator dashboard)
rusqlite = { version = "0.31", features = ["bundled"] }

# XDG directory support
dirs = "5.0"

# TOML config file parsing
toml = "0.8"

# fastVEP annotation engine (vep feature)
fastvep-annotate = { workspace = true, optional = true }
fastvep-core = { workspace = true, optional = true }
fastvep-io = { workspace = true, optional = true }


[[bin]]
name = "genohype"
path = "src/main.rs"

[[bin]]
name = "genohype-server"
path = "src/bin/hail-server.rs"
required-features = ["server"]

[dev-dependencies]
tempfile = "3.8"
criterion = "0.5"
